<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | M-TECH Premium Gadget Store</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/animations.css">
<script>window.MTECH_IMG={ok:function(){},fail:function(){}};</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<section id="main" class="section section--off" style="min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="max-width:440px;width:100%">
    <div style="text-align:center;margin-bottom:28px">
      <a class="brand" href="index.html" style="display:inline-flex;gap:10px;align-items:center;margin-bottom:20px;text-decoration:none;justify-content:center">
        <span class="brand-mark">M</span>
        <span class="brand-text"><span class="brand-name">M-TECH</span><span class="brand-sub">Premium Gadgets</span></span>
      </a>
      <h1 style="font-size:1.9rem;margin-bottom:8px">Reset Password</h1>
      <p class="small muted">Enter your account email. If it exists, we will send a reset link.</p>
    </div>

    <div id="success-msg" style="display:none;background:#eef8f1;border:1px solid #cbe8d6;border-radius:var(--radius-xs);padding:16px;font-size:.9rem;color:#166b3c;text-align:center;margin-bottom:18px">
      A password reset link has been sent. Please check your inbox and spam folder.
    </div>
    <div id="error-msg" style="display:none;background:#fdecea;border:1px solid #f2d4d4;border-radius:var(--radius-xs);padding:12px 16px;font-size:.88rem;color:#95271f;margin-bottom:18px"></div>

    <form id="fp-form" novalidate class="form-card">
      <div class="field" style="margin-bottom:18px">
        <label for="fp-email">Email address</label>
        <input id="fp-email" type="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <button class="btn btn--dark btn--block" type="submit" id="fp-btn">Send Reset Link</button>
      <p style="text-align:center;margin-top:18px;font-size:.88rem;color:var(--ink-55)">
        <a href="login.html" style="text-decoration:underline">Back to login</a>
      </p>
    </form>
  </div>
</section>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-auth.js"></script>
<script>
(function () {
  var form = document.getElementById("fp-form");
  var btn = document.getElementById("fp-btn");
  var errEl = document.getElementById("error-msg");
  var sucEl = document.getElementById("success-msg");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errEl.style.display = "none";
    if (!form.checkValidity()) { form.reportValidity(); return; }
    if (!window.MTECH_CONFIG || !MTECH_CONFIG.isEnabled) {
      errEl.textContent = "Firebase is not configured yet."; errEl.style.display = "block"; return;
    }
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await MTECH_AUTH.resetPassword(document.getElementById("fp-email").value.trim());
      form.style.display = "none";
      sucEl.style.display = "block";
    } catch (err) {
      btn.disabled = false; btn.textContent = "Send Reset Link";
      errEl.textContent = "Could not send reset email. Please check the address and try again.";
      errEl.style.display = "block";
    }
  });
})();
</script>
</body>
</html>
